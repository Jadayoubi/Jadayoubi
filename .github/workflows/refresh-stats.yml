name: Refresh stats

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # A personal access token that can read ALL your repositories (private included).
      # Classic token: scope `repo`. Fine-grained: all repositories, Contents + Metadata read.
      # Without it the job exits early so it never overwrites the banner with public-only numbers.
      GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Render stats
        if: env.GH_STATS_TOKEN != ''
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        if: env.GH_STATS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "stats unchanged" && exit 0
          git commit -m "chore: refresh stats banner"
          git push
