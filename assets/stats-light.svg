<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" role="img" aria-label="GitHub statistics for Jad Ayoubi">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .title { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #656d76; }
  .meta { font-size: 11px; fill: #656d76; }
  .num { font-size: 36px; font-weight: 800; fill: #1f2328; }
  .lbl { font-size: 12px; font-weight: 600; fill: #656d76; letter-spacing: .3px; }
  .sec { font-size: 12px; font-weight: 700; fill: #1f2328; }
  .leg { font-size: 11px; fill: #656d76; }
  .yr  { font-size: 12px; font-weight: 600; fill: #656d76; }
  .val { font-size: 12px; font-weight: 700; fill: #1f2328; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 900ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
</style>
